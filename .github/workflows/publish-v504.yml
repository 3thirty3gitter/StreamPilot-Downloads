name: Publish StreamPilot v504 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v504.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-0e60-8230-b1db-659cceab3427/raw?se=2026-09-23T01%3A22%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=17c74ce9-2116-4c46-aba4-47402e587d1d&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T22%3A46%3A53Z&ske=2026-09-23T22%3A46%3A53Z&sks=b&skv=2026-02-06&sig=/MaDzjLfrEzi3GN8NvKeIh02r7%2BC4dbBD45IFUQidpg%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Download, extract, and verify APK
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error "$ARTIFACT_URL" --output StreamPilot-v504.zip
          unzip -q StreamPilot-v504.zip StreamPilot-v504.apk
          rm StreamPilot-v504.zip
          echo "4decf2423ddc0024a5bcdec399827dabfcc03856a8d1e13cf01ad4da9903d4ac  StreamPilot-v504.apk" | sha256sum -c -
      - name: Publish APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StreamPilot-v504.apk
          git rm .github/workflows/publish-v504.yml
          git commit -m "Publish StreamPilot v504 APK"
          git push
